name: Academy draft QA
on:
  push:
    branches:
      - draft/engineering-academy
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  academy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Structural and answer-map checks
        run: node tests/academy-draft.cjs && node tests/academy-runtime.cjs && node tests/academy-answer-reference.cjs && node tests/academy-concurrency.cjs && node tests/academy-case-regression.cjs
      - name: Existing unit tests
        run: npm run test:unit
