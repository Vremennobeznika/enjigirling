name: Site checks
on:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate AI section exports
        run: node scripts/build-ai-packs.cjs
      - name: Run complete static QA matrix
        shell: bash
        run: |
          set -o pipefail
          node scripts/all-checks.cjs 2>&1 | tee static-qa.log
      - name: Static QA transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-qa-transcript
          path: static-qa.log
          if-no-files-found: ignore
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate AI section exports
        run: node scripts/build-ai-packs.cjs
      - name: Install browser test tooling
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test site at desktop and mobile widths
        run: npx playwright test
      - name: Save failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
