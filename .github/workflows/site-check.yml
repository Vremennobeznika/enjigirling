name: Site checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in *.js; do node --check "$file"; done
      - name: Check local HTML assets and catalog data
        run: node tests/site-check.cjs
      - name: Validate knowledge exports and cross-links
        run: node scripts/build-knowledge.cjs --check
