name: Publish verified knowledge base
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build machine-readable datasets from current source
        run: node scripts/build-knowledge.cjs
      - name: Verify generated knowledge datasets
        run: node scripts/build-knowledge.cjs --check
      - name: Generate complete Markdown and JSON AI packages
        run: |
          node scripts/build-ai-packs.cjs
          node scripts/build-ai-packs.cjs --check
      - name: Rebuild deterministic evidence coverage report
        run: node scripts/build-quality.cjs
      - name: Run complete static QA matrix
        shell: bash
        run: |
          set -o pipefail
          node scripts/all-checks.cjs 2>&1 | tee static-qa.log
      - name: Archive static QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-static-qa-transcript
          path: static-qa.log
          if-no-files-found: ignore
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for browser tests
        run: npx playwright install chromium
      - name: Validate desktop and mobile layouts
        run: npx playwright test
      - name: Archive browser failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-browser-test-results
          path: test-results/
          if-no-files-found: ignore
      - name: Prepare Pages
        uses: actions/configure-pages@v5
      - name: Stage static site without test dependencies
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='scripts/' \
            --exclude='test-results/' \
            --exclude='playwright-report/' \
            --exclude='_site/' \
            --exclude='package*.json' \
            --exclude='playwright.config.cjs' \
            --exclude='.gitignore' \
            ./ _site/
          touch _site/.nojekyll
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry_deployment.outputs.page_url || steps.final_deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait for competing Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 75
      - id: retry_deployment
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before final Pages retry
        if: steps.retry_deployment.outcome == 'failure'
        run: sleep 75
      - id: final_deployment
        if: steps.retry_deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recreate exact knowledge and AI packages for deployment checks
        run: |
          node scripts/build-knowledge.cjs
          node scripts/build-ai-packs.cjs
          node scripts/build-quality.cjs
      - name: Verify deployed site and knowledge API
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url || steps.retry_deployment.outputs.page_url || steps.final_deployment.outputs.page_url }}
        run: node scripts/check-live-site.cjs
