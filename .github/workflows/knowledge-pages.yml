name: Publish verified knowledge base
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build machine-readable datasets
        run: node scripts/build-knowledge.cjs
      - name: Validate generated datasets
        run: node scripts/build-knowledge.cjs --check
      - name: Check site assets
        run: node tests/site-check.cjs
      - name: Report source-evidence coverage
        run: node scripts/audit-knowledge.cjs
      - name: Prepare Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
