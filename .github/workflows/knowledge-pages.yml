name: Publish verified knowledge base
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Update official MC prices]
    branches: [main]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  # Preserve the in-progress publish while a newer push queues up.
  # Cancelling on each commit prevented any site version from deploying.
  cancel-in-progress: false
jobs:
  build:
    # The supplier snapshot may have been saved successfully even when the
    # independent Yandex upload failed. Always rebuild the public mirror from
    # trusted main; the client continues rejecting stale supplier dates.
    runs-on: ubuntu-latest
    outputs:
      pages_mode: ${{ steps.pages_mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build machine-readable datasets from current source
        run: node scripts/build-knowledge.cjs
      - name: Verify generated knowledge datasets
        run: node scripts/build-knowledge.cjs --check
      - name: Generate complete Markdown and JSON AI packages
        run: |
          node scripts/build-ai-packs.cjs
          node scripts/build-ai-packs.cjs --check
      - name: Rebuild deterministic evidence coverage report
        run: node scripts/build-quality.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build LLM and QA reader PDFs
        run: |
          python -m pip install --disable-pip-version-check 'reportlab==4.4.4'
          python scripts/build-resource-pdfs.py
      - name: Run complete static QA matrix
        shell: bash
        run: |
          set -o pipefail
          node scripts/all-checks.cjs 2>&1 | tee static-qa.log
      - name: Archive static QA diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-static-qa-transcript
          path: static-qa.log
          if-no-files-found: ignore
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium and WebKit for browser tests
        run: npx playwright install --with-deps chromium webkit
      - name: Validate desktop and mobile layouts
        run: npx playwright test
      - name: Archive browser failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pages-browser-test-results
          path: test-results/
          if-no-files-found: ignore
      - name: Prepare Pages
        uses: actions/configure-pages@v5
      - name: Read the configured Pages publishing mode
        id: pages_mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" > /tmp/pages-settings.json
          python3 - <<'PY'
          import json, os
          settings=json.load(open('/tmp/pages-settings.json'))
          mode=settings['build_type']
          if mode not in ('legacy','workflow'):
              raise SystemExit('Unsupported Pages publishing mode')
          if mode=='legacy' and settings.get('source')!={'branch':'main','path':'/'}:
              raise SystemExit('Unexpected legacy source; no files will be published')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('mode='+mode+'\n')
          PY
      - name: Verify generated reading files in the configured legacy source
        if: steps.pages_mode.outputs.mode == 'legacy'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --exit-code -- knowledge downloads knowledge-base.md knowledge-manifest.json llms.txt
          if [[ -n "$(git ls-files --others --exclude-standard -- knowledge downloads)" ]]; then
            echo 'Generated public files are missing from the source. Include the validated output in the pull request.'
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Stage static site without test dependencies
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='scripts/' \
            --exclude='test-results/' \
            --exclude='playwright-report/' \
            --exclude='_site/' \
            --exclude='package*.json' \
            --exclude='playwright.config.cjs' \
            --exclude='.gitignore' \
            --exclude='library-docs/' \
            --exclude='dist-ru/' \
            ./ _site/
          touch _site/.nojekyll
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: needs.build.outputs.pages_mode == 'workflow'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry_deployment.outputs.page_url || steps.final_deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait for competing Pages deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 75
      - id: retry_deployment
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before final Pages retry
        if: steps.retry_deployment.outcome == 'failure'
        run: sleep 75
      - id: final_deployment
        if: steps.retry_deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recreate exact knowledge and AI packages for deployment checks
        run: |
          node scripts/build-knowledge.cjs
          node scripts/build-ai-packs.cjs
          node scripts/build-quality.cjs
      - name: Verify deployed site and knowledge API
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url || steps.retry_deployment.outputs.page_url || steps.final_deployment.outputs.page_url }}
        run: node scripts/check-live-site.cjs
  verify_legacy:
    if: needs.build.outputs.pages_mode == 'legacy'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for the requested legacy Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..24}; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '.status')
            if [[ "$state" == 'built' ]]; then exit 0; fi
            if [[ "$state" == 'errored' ]]; then exit 1; fi
            sleep 10
          done
          exit 1
      - name: Verify deployed site and generated downloads
        env:
          SITE_URL: https://vremennobeznika.github.io/enjigirling/
        run: |
          node scripts/check-live-site.cjs
          python3 scripts/check-public-access.py --base-url "$SITE_URL" knowledge/reading/index.html mc-prices.json
