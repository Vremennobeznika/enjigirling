name: Browser smoke checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium
      - name: Start local site
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/site-server.log 2>&1 &
      - name: Create visual-review directory
        run: mkdir -p visual-review
      - name: Run responsive browser tests
        run: npx playwright test tests/site-visual.spec.cjs tests/site-functionality.spec.cjs tests/accessibility.spec.cjs --workers=2 --reporter=line
      - name: Verify metadata and page load
        run: node tests/site-check.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-screenshots
          path: visual-review/
          if-no-files-found: ignore
