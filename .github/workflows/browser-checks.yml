name: Browser smoke checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'processes.html'
      - 'processes.js'
      - 'processes-data.js'
      - 'materials.js'
      - 'materials-data.js'
      - 'script.js'
      - 'section-ui.css'
      - 'tests/process-atlas.cjs'
      - 'tests/site-functionality.spec.cjs'
      - 'tests/site-visual.spec.cjs'
      - 'tests/accessibility.spec.cjs'
      - '.github/workflows/browser-checks.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Generate reference knowledge files required by the site
        run: |
          node scripts/build-knowledge.cjs
          node scripts/build-ai-packs.cjs
          node scripts/build-quality.cjs
      - name: Create visual-review directory
        run: mkdir -p visual-review
      - name: Run responsive browser tests
        run: npx playwright test tests/site-visual.spec.cjs tests/site-functionality.spec.cjs tests/accessibility.spec.cjs --workers=2 --reporter=line
      - name: Verify metadata and page load
        run: node tests/site-check.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-screenshots
          path: visual-review/
          if-no-files-found: ignore
