name: Process atlas browser QA
on:
  push:
    paths:
      - 'processes.html'
      - 'processes.js'
      - 'processes-data.js'
      - 'materials-data.js'
      - 'tests/process-atlas.cjs'
      - '.github/workflows/process-atlas-qa.yml'
  workflow_dispatch:
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: node -e "console.log('Playwright version:', require('playwright/package.json').version)"
      - run: python3 -m http.server 8765 --bind 127.0.0.1 &
      - run: node tests/process-atlas.cjs
