name: External link audit
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '**/*.html'
      - 'materials-data.js'
      - 'processes-data.js'
      - 'career-standards-data.js'
      - 'calendar-data.js'
      - 'resources-data.js'
      - 'salary-sources.js'
      - 'script.js'
      - 'map-data.js'
      - 'tests/external-links.cjs'
      - '.github/workflows/external-links.yml'
  workflow_dispatch:
    inputs:
      retry_report:
        description: Optional repository JSON report; retry only its unverified URLs
        required: false
        default: ''
        type: string
  schedule:
    - cron: '0 7 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit external resources
        env:
          RETRY_REPORT: ${{ inputs.retry_report }}
        run: |
          if [[ -n "$RETRY_REPORT" ]]; then
            node tests/external-links.cjs "--retry-unverified=$RETRY_REPORT"
          else
            node tests/external-links.cjs
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-link-report
          path: audit/
          if-no-files-found: warn
