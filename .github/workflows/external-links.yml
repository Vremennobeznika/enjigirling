name: External link audit
on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '**/*.html'
      - 'materials-data.js'
      - 'processes-data.js'
      - 'career-standards-data.js'
      - 'calendar-data.js'
      - 'resources-data.js'
      - 'salary-sources.js'
      - 'script.js'
      - 'map-data.js'
      - 'tests/external-links.cjs'
      - '.github/workflows/external-links.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit external resources
        run: node tests/external-links.cjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-link-report
          path: audit/
          if-no-files-found: warn
