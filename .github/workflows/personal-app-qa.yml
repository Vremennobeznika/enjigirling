name: Personal app quality matrix

on:
  push:
    branches: [main]
    paths:
      - 'life/**'
      - 'life-pwa-sw.js'
      - 'calendar/index.html'
      - 'calendar/household.js'
      - 'plants/**'
      - 'shopping/**'
      - 'tests/life-*.cjs'
      - 'tests/personal-planner.spec.cjs'
      - 'tests/personal-reminders.cjs'
      - 'tests/personal-ics.cjs'
      - 'tests/calendar-layout.spec.cjs'
      - 'tests/personal-flows.spec.cjs'
      - 'scripts/all-checks.cjs'
      - '.github/workflows/personal-app-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-app-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Personal app — Chromium and WebKit iPhone checks
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and simulated multi-device data tests
        run: |
          node --check life/auto-sync.js
          node --check life/sw.js
          node --check life-pwa-sw.js
          node --check life/planner/model.js
          node --check life/planner/config.js
          node --check life/planner/app.js
          node tests/life-sync.cjs
          node tests/life-planner-parity.cjs
          node --check life/active-reminders.js
          node tests/personal-reminders.cjs
          node tests/personal-ics.cjs
      - name: Install browser test tools
        run: npm install --no-audit --no-fund
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Calendar, dashboard, shopping and plants in Chromium
        run: npx playwright test tests/calendar-layout.spec.cjs tests/life-layout.spec.cjs tests/personal-flows.spec.cjs tests/personal-planner.spec.cjs --project=chromium-desktop
      - name: Safari engine - iPhone form layout in WebKit
        run: npx playwright test tests/life-layout.spec.cjs --project=webkit-iphone
      - name: Upload screenshots and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: personal-app-browser-test-results
          path: test-results/
          if-no-files-found: ignore
