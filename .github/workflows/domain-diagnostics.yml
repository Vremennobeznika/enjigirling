name: Public domain DNS and HTTPS diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/domain-diagnostics.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect storage access without changing bucket permissions
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ru-central1
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_PAGER: ''
        run: |
          python3 - <<'PY'
          import json, subprocess
          base=['aws','--endpoint-url=https://storage.yandexcloud.net','s3api']
          for command in [
              ['head-bucket','--bucket','enjigirling.ru'],
              ['head-object','--bucket','enjigirling.ru','--key','index.html'],
              ['get-object-acl','--bucket','enjigirling.ru','--key','index.html'],
              ['get-bucket-policy','--bucket','enjigirling.ru'],
              ['get-bucket-website','--bucket','enjigirling.ru']]:
              r=subprocess.run(base+command,capture_output=True,text=True,timeout=20)
              result={'operation':command[0],'exitCode':r.returncode}
              if r.returncode:
                  result['error']=r.stderr.strip()[:700]
              else:
                  data=json.loads(r.stdout or '{}')
                  if command[0]=='get-object-acl':
                      result['anonymousRead']=any(g.get('Grantee',{}).get('URI','').endswith('/AllUsers') and g.get('Permission') in ('READ','FULL_CONTROL') for g in data.get('Grants',[]))
                  elif command[0]=='get-bucket-policy':
                      statements=json.loads(data['Policy']).get('Statement',[])
                      if isinstance(statements,dict): statements=[statements]
                      result['statementCount']=len(statements)
                      result['effects']=[s.get('Effect') for s in statements]
                      result['conditionKeys']=[list(s.get('Condition',{})) for s in statements]
                  elif command[0]=='get-bucket-website':
                      result['indexDocument']=data.get('IndexDocument',{}).get('Suffix')
                  elif command[0]=='head-object':
                      result['bytes']=data.get('ContentLength')
                      result['contentType']=data.get('ContentType')
              print(json.dumps(result),flush=True)
          PY
      - name: Diagnose authoritative and public DNS
        shell: bash
        run: |
          set +e
          echo '==== PUBLIC NS'
          dig +time=3 +tries=1 @1.1.1.1 enjigirling.ru NS +short
          dig +time=3 +tries=1 @8.8.8.8 enjigirling.ru NS +short
          echo '==== PUBLIC A'
          dig +time=3 +tries=1 @1.1.1.1 enjigirling.ru A +short
          dig +time=3 +tries=1 @8.8.8.8 enjigirling.ru A +short
          echo '==== PUBLIC AAAA'
          dig +time=3 +tries=1 @1.1.1.1 enjigirling.ru AAAA +short
          echo '==== WWW RECORD'
          dig +time=3 +tries=1 @1.1.1.1 www.enjigirling.ru CNAME +short
          dig +time=3 +tries=1 @1.1.1.1 www.enjigirling.ru A +short
          echo '==== AUTHORITY'
          dig +time=3 +tries=1 +trace enjigirling.ru NS | tail -40
      - name: Probe bucket website and custom domain independently
        shell: bash
        run: |
          set +e
          for url in \
            'https://website.yandexcloud.net/enjigirling.ru/' \
            'http://enjigirling.ru.website.yandexcloud.net/' \
            'http://enjigirling.ru/' \
            'https://enjigirling.ru/' \
            'https://enjigirling.ru/coding.html' \
            'https://enjigirling.ru/robotics.html'; do
            echo "==== PROBE $url"
            curl -sS -L -o /dev/null --max-time 12 --connect-timeout 6 \
              -w 'http=%{http_code} remote_ip=%{remote_ip} ssl_verify=%{ssl_verify_result} redirects=%{num_redirects} final=%{url_effective} errmsg=%{errormsg}\n' "$url"
            echo "curl_exit=$?"
          done
      - name: Check active HTTPS certificate if DNS resolves
        shell: bash
        run: |
          set +e
          echo | timeout 8 openssl s_client -connect enjigirling.ru:443 -servername enjigirling.ru 2>&1 | grep -Ei 'subject=|issuer=|Verify return|connect:errno|Name or service|certificate' | head -20
