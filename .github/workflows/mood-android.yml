name: SLOI Android APK and source checks
on:
  workflow_dispatch:
    inputs:
      device_qa:
        description: 'Run device-side QA on Android emulators'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'mood-layers/**'
      - '.github/workflows/mood-android.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK path
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMGR"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMGR")" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Static tests and bundle local assets
        shell: bash
        run: |
          set -euo pipefail
          node --check mood-layers/app.js
          node --check mood-layers/goals.js
          node --check mood-layers/wellness.js
          node --check mood-layers/i18n.js
          node --check mood-layers/pwa-ui.js
          node --check mood-layers/sw.js
          python3 mood-layers/tests/static_matrix.py
          mkdir -p mood-layers/android/app/src/main/assets/assets
          cp mood-layers/index.html mood-layers/style.css mood-layers/pwa-style.css mood-layers/app.js mood-layers/goals.js mood-layers/wellness.js mood-layers/i18n.js mood-layers/pwa-ui.js mood-layers/sw.js mood-layers/manifest.webmanifest mood-layers/android/app/src/main/assets/
          cp mood-layers/assets/icon.* mood-layers/assets/icon-*.png mood-layers/android/app/src/main/assets/assets/
      - name: Build debug APK
        working-directory: mood-layers/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK archive/signature
        shell: bash
        run: |
          set -euo pipefail
          APK=mood-layers/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" > /dev/null
          unzip -Z1 "$APK" | grep -q '^classes.dex$'
          for name in app.js goals.js wellness.js i18n.js pwa-ui.js pwa-style.css; do
            unzip -Z1 "$APK" | grep -q "^assets/$name$"
          done
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: SLOI-Android-debug-apk
          path: mood-layers/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  device-qa:
    if: github.event_name == 'workflow_dispatch' && inputs.device_qa
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [23, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare old and current Android packages
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 6efd3051f0e786ff7b6066058766b86d89cce45f
          mkdir -p /tmp/psho-legacy
          git archive FETCH_HEAD mood-layers | tar -x -C /tmp/psho-legacy
          mkdir -p /tmp/psho-legacy/mood-layers/android/app/src/main/assets/assets
          cp /tmp/psho-legacy/mood-layers/*.js /tmp/psho-legacy/mood-layers/*.css /tmp/psho-legacy/mood-layers/index.html /tmp/psho-legacy/mood-layers/manifest.webmanifest /tmp/psho-legacy/mood-layers/android/app/src/main/assets/
          cp /tmp/psho-legacy/mood-layers/assets/* /tmp/psho-legacy/mood-layers/android/app/src/main/assets/assets/
          mkdir -p mood-layers/android/app/src/main/assets/assets
          cp mood-layers/*.js mood-layers/*.css mood-layers/index.html mood-layers/manifest.webmanifest mood-layers/android/app/src/main/assets/
          cp mood-layers/assets/* mood-layers/android/app/src/main/assets/assets/
          gradle -p /tmp/psho-legacy/mood-layers/android --no-daemon :app:assembleDebug
          gradle -p mood-layers/android --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install, update, restart and native backup on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 mood-layers/tests/android-device-qa.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psho-android-${{ matrix.api }}-evidence
          path: /tmp/psho-device-evidence/
          if-no-files-found: warn
