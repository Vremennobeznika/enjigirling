name: PSHO unit UX and load QA
on:
  push:
    branches: [main]
    paths:
      - 'mood-layers/app.js'
      - 'mood-layers/goals.js'
      - 'mood-layers/index.html'
      - 'mood-layers/i18n.js'
      - 'mood-layers/style.css'
      - 'mood-layers/tests/psho-quality-unit.cjs'
      - 'mood-layers/tests/psho-quality-browser.py'
      - '.github/workflows/psho-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: node mood-layers/tests/psho-quality-unit.cjs
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Scripted UX, layout and load checks
        run: python mood-layers/tests/psho-quality-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psho-quality-evidence
          path: |
            mood-layers/tests/psho-quality-results.json
            mood-layers/tests/psho-280.png
            mood-layers/tests/psho-390.png
          if-no-files-found: warn
