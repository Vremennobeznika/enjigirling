name: CHROMA Android APK and screenshots

on:
  push:
    paths:
      - 'chroma/index.html'
      - 'chroma/android/**'
      - 'chroma/tests/ci_screenshots.py'
      - '.github/workflows/chroma-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android 36 platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Bundle reviewed offline assets
        run: |
          mkdir -p chroma/android/app/src/main/assets/assets
          cp chroma/index.html chroma/android/app/src/main/assets/index.html
          cp chroma/manifest.webmanifest chroma/android/app/src/main/assets/manifest.webmanifest
          cp chroma/assets/icon.svg chroma/android/app/src/main/assets/assets/icon.svg
      - name: Assemble signed development APK
        run: gradle -p chroma/android :app:assembleDebug --no-daemon --stacktrace
      - name: Validate APK ZIP contents
        run: |
          unzip -t chroma/android/app/build/outputs/apk/debug/app-debug.apk | tail -n 2
          test -s chroma/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CHROMA-android-debug-apk
          path: chroma/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
      - name: Create unique preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="chroma-preview-${GITHUB_SHA:0:8}"
          gh release create "$tag" "chroma/android/app/build/outputs/apk/debug/app-debug.apk#CHROMA-preview.apk" --target "$GITHUB_SHA" --title "CHROMA Android preview ${GITHUB_SHA:0:8}" --notes "Android 6.0+, fully offline, zero requested permissions. Development-key APK: testing only. No psychological diagnosis or medical advice." --prerelease

  screenshots-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Audit responsive flows and capture screenshots
        run: python chroma/tests/ci_screenshots.py
      - name: Attach genuine Chromium screenshots to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chroma/screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "Attach verified CHROMA mobile screenshots [skip ci]"
            git push
          fi
