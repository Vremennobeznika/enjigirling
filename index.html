<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="База данных инженерных профессий: обязанности, образование, зарплаты, карьерный путь и типичный рабочий день.">
<title>Профессии инженеров</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="site-page">
  <nav class="eng-tabs" aria-label="Основная навигация">
    <a href="index.html" class="eng-tab active">Профессии</a>
    <a href="calendar.html" class="eng-tab">Календарь праздников</a>
    <a href="resources.html" class="eng-tab">Ресурсы сообщества<span class="age-badge">18+</span></a>
    <a href="dictionary.html" class="eng-tab">Словарь инженера</a>
    <a href="map.html" class="eng-tab">Обучение</a>
    <a href="calculator.html" class="eng-tab">Калькуляторы инженера</a>
  </nav>

  <header class="page-header">
    <h1>Профессии инженеров</h1>
    <p>Открой карточку, чтобы посмотреть подробности о профессии.</p>
  </header>

  <div class="eng-filters professions-tools" aria-label="Поиск и сортировка профессий">
    <input id="professionSearch" type="search" placeholder="Поиск по профессиям" autocomplete="off">
    <select id="professionSort" aria-label="Сортировка">
      <option value="default">Порядок по разделам</option>
      <option value="az">По алфавиту А–Я</option>
      <option value="za">По алфавиту Я–А</option>
    </select>
  </div>
  <div class="eng-filters" id="categories" aria-label="Фильтр по категориям"></div>
  <div class="eng-filters asu-subfilters" id="asuSubcategories" aria-label="Подразделы АСУ ТП"></div>
  <div class="eng-grid" id="professionsGrid"></div>
</main>

<div class="modal-overlay" id="modalOverlay" aria-hidden="true">
  <article class="modal" role="dialog" aria-modal="true" aria-labelledby="modalContent">
    <button class="modal-close" id="modalClose" type="button" aria-label="Закрыть">&times;</button>
    <div class="modal-content" id="modalContent"></div>
  </article>
</div>

<footer>
  <p>© 2026 — База данных профессий инженеров</p>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Переключить тему">☾</button>
</footer>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
