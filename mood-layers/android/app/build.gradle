plugins { id 'com.android.application' }
android {
 namespace 'app.layers.mood'
 compileSdk 36
 defaultConfig {
  applicationId 'app.layers.mood'
  minSdk 23
  targetSdk 36
  versionCode 5
  versionName '1.2.0'
 }
 buildTypes {
  debug { manifestPlaceholders = [appLabel: 'СЛОИ · тест'] }
  release {
   applicationIdSuffix '.stable'
   manifestPlaceholders = [appLabel: 'СЛОИ']
   minifyEnabled false
  }
 }
 compileOptions {
  sourceCompatibility JavaVersion.VERSION_17
  targetCompatibility JavaVersion.VERSION_17
 }
}
