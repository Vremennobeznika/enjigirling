<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111111"><title>Список покупок</title>
<style>
:root{color-scheme:dark;--bg:#0c0c0c;--panel:#191919;--line:#3a3a3a;--fg:#f5f5f5;--muted:#aaa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
main{max-width:760px;margin:auto;padding:20px 14px 110px}h1{font-size:29px;margin:0 0 4px;letter-spacing:-.6px}p{margin:0;color:var(--muted)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.counter{font-size:13px;border:1px solid var(--line);border-radius:20px;padding:7px 10px;white-space:nowrap}
.progress{height:5px;background:#333;border-radius:8px;overflow:hidden;margin:17px 0}.progress div{height:100%;background:#ddd;width:0%;transition:width .15s}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:5px 0 13px;scrollbar-width:thin}.tab{border:1px solid #454545;background:#171717;color:#ddd;border-radius:20px;padding:9px 13px;white-space:nowrap;font-size:14px;cursor:pointer}.tab.active{background:#eee;color:#111;border-color:#eee;font-weight:700}.tab small{opacity:.7;margin-left:5px}
.panel{border:1px solid var(--line);background:var(--panel);border-radius:16px;overflow:hidden}.panel-head{padding:15px 15px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}.panel-head h2{font-size:18px;margin:0}.hint{font-size:12px;color:var(--muted)}
form{display:flex;gap:7px;padding:0 12px 14px;flex-wrap:wrap}input,button{font:inherit}input[type=text]{min-width:0;flex:1 1 150px;background:#0f0f0f;color:#fff;border:1px solid #555;border-radius:10px;padding:12px}input.qty{flex:0 0 94px;width:94px}button{cursor:pointer}button.primary{border:1px solid #eee;background:#eee;color:#111;border-radius:10px;padding:11px 15px;font-weight:700}
ul{padding:0;margin:0;list-style:none}.item{display:flex;align-items:center;gap:10px;border-top:1px solid #343434;padding:11px 13px;min-height:58px}.item input[type=checkbox]{appearance:none;width:24px;height:24px;flex:none;border:2px solid #aaa;border-radius:7px;background:#111;cursor:pointer;position:relative}.item input[type=checkbox]:checked{background:#ddd;border-color:#ddd}.item input[type=checkbox]:checked:after{content:"✓";position:absolute;color:#111;top:-3px;left:3px;font-size:20px;font-weight:bold}
.item .name{flex:1;min-width:0;overflow-wrap:anywhere}.item.done .name{text-decoration:line-through;color:#858585}.amount{color:#aaa;font-size:13px;white-space:nowrap}.del{border:0;background:none;color:#aaa;font-size:24px;padding:3px 6px}.empty{padding:24px 15px;text-align:center;color:#999;border-top:1px solid #333}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.tools button,.tools label{border:1px solid #555;background:#1b1b1b;color:#eee;border-radius:10px;padding:10px 12px;font-size:13px;cursor:pointer}.tools input{display:none}.footer{font-size:12px;margin-top:14px;line-height:1.6}
@media(max-width:420px){h1{font-size:25px}.counter{font-size:12px}.item{gap:8px}.amount{max-width:85px;overflow:hidden;text-overflow:ellipsis}}
.item{flex-wrap:wrap}.item-time{width:104px;flex:none;min-height:42px;font-size:14px;border:1px solid #555;border-radius:9px;background:#111;color:#eee;padding:8px}.reminder-toggle{border:1px solid #666;border-radius:9px;background:#222;color:#eee;padding:9px 11px;min-height:42px;font-size:12px}.reminder-toggle[aria-pressed=true]{border-color:#eee}.item .name{flex-basis:30%}@media(max-width:420px){.item .name{flex-basis:55%}.item-time{width:103px}.reminder-toggle{font-size:12px}}</style></head><body><main>
<div class="top"><div><h1>Список покупок</h1><p>По отделам супермаркета</p></div><div class="counter" id="counter">0 из 0</div></div><div class="progress"><div id="bar"></div></div>
<nav class="tabs" id="tabs" aria-label="Отделы магазина"></nav>
<section class="panel"><div class="panel-head"><h2 id="sectionTitle"></h2><span class="hint" id="sectionCount"></span></div>
<form id="addForm"><input id="itemName" type="text" placeholder="Что купить" maxlength="120" required autocomplete="off" aria-label="Название товара"><input id="itemQty" class="qty" type="text" placeholder="Кол-во" maxlength="35" aria-label="Количество"><button class="primary" type="submit">Добавить</button></form><ul id="items"></ul><div class="empty" id="empty">Пока ничего нет. Добавь товар выше.</div></section>
<div class="tools"><button type="button" id="removeDone">Удалить купленное</button><button type="button" id="export">Сохранить копию</button><label for="import">Загрузить копию<input id="import" type="file" accept="application/json,.json"></label><button type="button" id="reset">Очистить весь список</button></div>
<p class="footer">Товары сначала сохраняются в этом браузере. Если включена облачная синхронизация в панели «Сегодня», они передаются между твоими устройствами. «Сохранить копию» оставлено для резервного экспорта.</p></main><script>
(()=>{"use strict";
const cats=[["all","Всё"],["produce","Овощи и фрукты"],["bakery","Хлеб и выпечка"],["dairy","Молочные продукты и яйца"],["meat","Мясо и птица"],["fish","Рыба и морепродукты"],["grocery","Крупы, макароны, консервы"],["frozen","Заморозка"],["drinks","Напитки"],["sweets","Сладости и снеки"],["sauces","Соусы, специи, масло"],["home","Бытовая химия"],["hygiene","Гигиена и косметика"],["baby","Детские товары"],["pets","Для животных"],["other","Прочее"]];
const key="supermarket-shopping-list-v1";
function loadShop(){try{let a=JSON.parse(localStorage.getItem(key)||"[]");if(Array.isArray(a))return a.filter(x=>x&&typeof x.name==="string"&&cats.some(c=>c[0]===x.cat)).map(x=>({id:String(x.id||Math.random()),name:x.name.slice(0,120),qty:String(x.qty||"").slice(0,35),cat:x.cat,done:!!x.done,time:/^([01]\d|2[0-3]):[0-5]\d$/.test(x.time||"")?x.time:"",remind:!!x.remind&&/^([01]\d|2[0-3]):[0-5]\d$/.test(x.time||"")}))}catch(e){}return []}
let data=loadShop();
let active="all";
const $=id=>document.getElementById(id),save=()=>{try{localStorage.setItem(key,JSON.stringify(data));window.dispatchEvent(new Event("life-data-changed"));}catch(e){alert("Браузер не разрешил сохранить данные. Используй «Сохранить копию».");}};
function node(tag,cl,txt){let el=document.createElement(tag);if(cl)el.className=cl;if(txt!==undefined)el.textContent=txt;return el}
function render(){
const done=data.filter(x=>x.done).length;$("counter").textContent=done+" из "+data.length;$("bar").style.width=(data.length?done/data.length*100:0)+"%";
const tabs=$("tabs");tabs.replaceChildren();
cats.forEach(([id,label])=>{let n=data.filter(x=>id==="all"||x.cat===id).length,b=node("button","tab"+(active===id?" active":""),label);b.type="button";b.setAttribute("aria-pressed",String(active===id));b.append(node("small","",String(n)));b.onclick=()=>{active=id;render();};tabs.append(b)});
$("sectionTitle").textContent=cats.find(c=>c[0]===active)[1];let visible=data.filter(x=>active==="all"||x.cat===active);
$("sectionCount").textContent=visible.filter(x=>x.done).length+" / "+visible.length;
const ul=$("items");ul.replaceChildren();$("empty").hidden=visible.length>0;
visible.sort((a,b)=>Number(a.done)-Number(b.done)).forEach(x=>{
let li=node("li","item"+(x.done?" done":"")),cb=node("input");cb.type="checkbox";cb.checked=x.done;cb.setAttribute("aria-label","Куплено: "+x.name);cb.onchange=()=>{x.done=cb.checked;save();render();};
let name=node("span","name",x.name);if(active==="all"){let label=node("div","hint",cats.find(c=>c[0]===x.cat)?.[1]||"");let wrap=node("div","name");wrap.append(node("div","",x.name),label);name=wrap}
let amount=node("span","amount",x.qty),del=node("button","del","×");del.type="button";del.setAttribute("aria-label","Удалить "+x.name);del.onclick=()=>{data=data.filter(y=>y.id!==x.id);save();render()};
let time=node("input","item-time");time.type="time";time.value=x.time||"12:00";time.setAttribute("aria-label","Время напоминания о покупке "+x.name);time.onchange=()=>{x.time=time.value;x.remind=!!x.remind&&!!x.time;save();render()};
let bell=node("button","reminder-toggle",x.remind?"Напоминать ✓":"Напомнить");bell.type="button";bell.setAttribute("aria-pressed",String(!!x.remind));bell.setAttribute("aria-label",(x.remind?"Выключить":"Включить")+" напоминание: "+x.name);bell.onclick=()=>{x.remind=!x.remind;x.time=x.time||time.value||"12:00";save();render()};
li.append(cb,name,amount,time,bell,del);ul.append(li);
});
}
$("addForm").onsubmit=e=>{e.preventDefault();let name=$("itemName").value.trim(),qty=$("itemQty").value.trim();if(!name)return;const category=active==="all"?"other":active;
data.push({id:Date.now()+"-"+Math.random().toString(36).slice(2),name,qty,cat:category,done:false});save();$("itemName").value="";$("itemQty").value="";render();$("itemName").focus();};
$("removeDone").onclick=()=>{if(!data.some(x=>x.done))return;if(confirm("Удалить все отмеченные покупки?")){data=data.filter(x=>!x.done);save();render();}};
$("reset").onclick=()=>{if(confirm("Удалить ВСЕ товары из списка?")){data=[];save();render();}};
$("export").onclick=()=>{let blob=new Blob([JSON.stringify({version:1,items:data},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="spisok-pokupok.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$("import").onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{if(f.size>1000000)throw Error("Файл слишком большой (максимум 1 МБ)");let j=JSON.parse(await f.text()),arr=Array.isArray(j)?j:j.items;if(!Array.isArray(arr))throw Error();let cleaned=arr.filter(x=>x&&typeof x.name==="string"&&cats.some(c=>c[0]===x.cat)).map(x=>({id:String(x.id||Math.random()),name:x.name.slice(0,120),qty:String(x.qty||"").slice(0,35),cat:x.cat,done:!!x.done,time:/^([01]\d|2[0-3]):[0-5]\d$/.test(x.time||"")?x.time:"",remind:!!x.remind&&/^([01]\d|2[0-3]):[0-5]\d$/.test(x.time||"")}));if(!confirm("Заменить текущий список загруженной копией ("+cleaned.length+" товаров)?"))return;data=cleaned;save();render();}catch(err){alert("Не удалось прочитать файл списка.");}finally{e.target.value="";}};
window.addEventListener("life-sync-applied",()=>{data=loadShop();render()});
window.addEventListener("storage",e=>{if(e.key===key){data=loadShop();render()}});
render();
})();
</script><script src="../life/auto-sync.js"></script><script defer src="../life/planner/model.js"></script><script defer src="../life/planner/config.js"></script><script defer src="../life/active-reminders.js"></script></body></html>
